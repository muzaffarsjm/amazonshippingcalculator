<!DOCTYPE html>
<html>
  <head>
    <title>
      Amusement park
    </title>
    <style>
      body{
        background-color: aliceblue;
      }
      .style-title{
        text-align: center;
        font-size: 50px;
        letter-spacing: 2px;
        color: rgb(34, 46, 46);
      }
      .styles-intro{
        font-size: 20px;
        padding-bottom: 50px;
      }
      .styles-age-input{
        height: 40px;
        width: 200px;
        font-size: 20px;
        font-style: italic;
        border-radius: 8px;
        border: 1px solid black;
        padding-left: 10px;
        cursor: pointer;
      }
      .styles-button{
        height: 44px;
        width: 140px;
        font-size: 20px;
        background-color: white;
        border: 1px solid black;
        border-radius: 8px;
        margin-left: 7px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p class="style-title">Amusement Park</p>
    <div>
      <p class="styles-intro">Visitors can have discounts on the ticket prices if they are younger than 6, or older than 65. regular ticket prices are $100.</p>
    </div>

    <input type="text" placeholder="type age" class="styles-age-input js-age">
    <button class="js-calculator-button styles-button" onclick="ticketDiscount()">Calculate</button>
    <p class="js-discount-message"></p>

    <script>

   

      function ticketDiscount(){
        let ageInput = document.querySelector('.js-age');
        let userAge = Number(ageInput.value);
     
        message = '';
        let discountMessage = document.querySelector('.js-discount-message');
        if(userAge )
          if( userAge > 65 || userAge < 6){
            message = 'Congrats. You can use 20% discount. Pay $80';
          }else {
            message = 'Sorry. We will do our best to offer you discount soon.';
          };
        discountMessage.innerHTML = message;
        console.log(userAge)
      };
    </script>
  </body>
</html>
